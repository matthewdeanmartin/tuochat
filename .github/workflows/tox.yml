---
name: tox multi-version
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tox:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install tox + tox-uv
        run: uv tool install tox --with tox-uv
      - name: Run tox
        # Use the version-specific env (e.g. py315) rather than the generic
        # `py`, so 3.15 picks up [testenv:py315] and its reduced extras list.
        # rtoml/lupa have no 3.15 wheels, so `extras = all` cannot resolve there.
        run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d .)
        shell: bash
