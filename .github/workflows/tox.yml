---
name: tox multi-version
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tox:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13', '3.15']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Install tox + tox-uv
        run: uv tool install tox --with tox-uv
      - name: Run tox
        # Use the version-specific env (e.g. py315) rather than the generic
        # `py`, so 3.15 picks up [testenv:py315] and its reduced extras list.
        # rtoml/lupa have no 3.15 wheels, so `extras = all` cannot resolve there.
        run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d .)
        shell: bash
